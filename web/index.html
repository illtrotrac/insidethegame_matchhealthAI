<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Health overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07140d;
      --panel: rgba(6, 14, 9, .88);
      --panel-2: rgba(6, 14, 9, .6);
      --ink: #f4fff7;
      --ink-dim: rgba(244, 255, 247, .68);
      --border: rgba(244, 255, 247, .14);
      --control: #22c55e;   /* in-possession, calm; also "team A" */
      --away: #38bdf8;      /* "team B" in the health meter, for a clear vs */
      --chaos: #f59e0b;     /* pressure, turnovers */
      --gold: #fbbf24;      /* big moments */
      --info: #38bdf8;      /* comparisons */
      --muted: #94a3b8;     /* fallback / degraded */
      --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      padding-block: 20px 40px;
    }
    .wrap { max-width: 1400px; margin: 0 auto; padding-inline: 16px; }

    /* ---- header: teams, clock, controls -------------------------------- */
    .matchbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .teams {
      display: flex; align-items: baseline; gap: 10px;
      font-family: var(--display); font-weight: 700; font-size: 1.3rem;
      letter-spacing: .01em; text-transform: uppercase;
    }
    .teams .score {
      font-variant-numeric: tabular-nums; color: var(--gold); font-size: 1.5rem;
      min-width: 2.4em; text-align: center;
    }
    .clock {
      font-variant-numeric: tabular-nums; color: var(--ink-dim);
      font-size: .85rem; border: 1px solid var(--border); border-radius: 999px;
      padding: 2px 10px; font-family: -apple-system, system-ui, sans-serif;
    }
    .controls { display: flex; gap: 10px; }
    .controls label {
      display: flex; align-items: center; gap: 6px; font-size: .78rem;
      color: var(--ink-dim); text-transform: uppercase; letter-spacing: .04em;
    }
    .controls select {
      background: var(--panel-2); color: var(--ink); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 8px; font: inherit;
    }

    /* ---- match health meter: the actual point of this project ---------- */
    .health {
      border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px;
      margin-bottom: 14px; background: var(--panel-2);
    }
    .health-title {
      font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--ink-dim); margin-bottom: 10px;
    }
    .health-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .health-row:last-child { margin-bottom: 0; }
    .health-row .name { width: 150px; font-size: .85rem; flex-shrink: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .health-bar {
      flex: 1; height: 10px; border-radius: 999px; background: rgba(255,255,255,.08);
      overflow: hidden; position: relative;
    }
    .health-fill {
      height: 100%; border-radius: 999px; background: var(--control);
      width: 50%; transition: width .6s ease;
    }
    .health-row.away .health-fill { background: var(--away); }
    .health-num {
      width: 42px; text-align: right; font-variant-numeric: tabular-nums;
      font-family: var(--display); font-weight: 700; font-size: 1rem;
      color: var(--ink); flex-shrink: 0;
    }
    .health.stale { opacity: .45; }

    /* ---- layout: stage + agent activity side by side on wider screens --- */
    .main-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 860px) {
      .main-grid { grid-template-columns: 1.7fr 1fr; align-items: start; }
    }

    /* ---- Agent Activity: the Spotter's real confirm/reject decisions ---- */
    .activity-panel {
      border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2);
      padding: 12px 14px; max-height: 420px; overflow-y: auto;
    }
    .activity-title {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--ink-dim); margin-bottom: 10px;
    }
    .activity-title span { font-variant-numeric: tabular-nums; text-transform: none; letter-spacing: 0; }
    .activity-item {
      display: flex; gap: 8px; padding: 7px 0; border-top: 1px solid var(--border);
      font-size: .82rem; animation: activity-in .3s ease;
    }
    .activity-item:first-child { border-top: none; }
    .activity-item.rejected { opacity: .55; }
    .activity-badge {
      flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .68rem; font-weight: 700; margin-top: 1px;
    }
    .activity-item.confirmed .activity-badge { background: rgba(34,197,94,.18); color: var(--control); }
    .activity-item.rejected .activity-badge { background: rgba(148,163,184,.18); color: var(--muted); }
    .activity-body .headline { font-weight: 600; }
    .activity-body .meta {
      color: var(--ink-dim); font-size: .74rem; font-variant-numeric: tabular-nums;
    }
    .activity-body .reason { color: var(--ink-dim); font-size: .76rem; font-style: italic; }
    @keyframes activity-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }

    /* ---- the pitch / broadcast stage ------------------------------------ */
    .stage {
      position: relative; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden;
      background:
        radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.4) 100%),
        repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 2px, transparent 2px 64px),
        linear-gradient(160deg, #1d6639, #0e3a20);
      border: 1px solid var(--border);
    }
    .pitch-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .pitch-lines path, .pitch-lines rect, .pitch-lines circle {
      fill: none; stroke: rgba(255,255,255,.28); stroke-width: 2.5;
    }
    .pitch-lines rect.goal { stroke: rgba(255,255,255,.55); stroke-width: 3.5; }
    .watermark {
      position: absolute; right: 14px; bottom: 10px; z-index: 2;
      font-family: var(--display); font-weight: 700; letter-spacing: .08em;
      font-size: .72rem; text-transform: uppercase; color: rgba(255,255,255,.4);
    }
    /* Ambient player dots: ATMOSPHERE, not tracked data. The synthetic match
       only records one ball/action position per event (see generator.py) --
       there's no real per-player feed to animate -- so this drifts a small
       set of team-coloured markers around the pitch to make the stage read
       as "a match is happening" rather than a flat background. Deliberately
       small, muted and below the overlay layer so it never competes with
       the actual data-driven graphics. */
    .player-dot {
      position: absolute; width: 11px; height: 11px; border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 1px 3px rgba(0,0,0,.5);
      transition: left 3.2s ease-in-out, top 3.2s ease-in-out;
      opacity: .55; z-index: 1;
    }
    .player-dot.home { background: var(--control); }
    .player-dot.away { background: var(--away); }

    /* The ball marker and its possession ring/initials share ONE positioned
       wrapper (ball-wrap), so the ring is physically attached to the ball
       dot and moves with it -- not a separately-animated element that has
       to chase a copied coordinate and visibly drifts apart mid-motion. */
    .ball-wrap {
      position: absolute; transform: translate(-50%, -50%);
      transition: left 1.1s ease-in-out, top 1.1s ease-in-out; z-index: 1;
    }
    .ball-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.6); opacity: .8;
    }
    /* Possession ring: real data (the overlay's focus_player), approximate
       position (it rides the ambient ball marker -- there's no real per-
       event coordinate piped to the frontend, see the comment above). */
    .spotlight-ring {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid var(--gold); box-shadow: 0 0 8px rgba(251,191,36,.5);
      animation: spotlight-pulse 1.2s ease-in-out infinite;
      pointer-events: none;
    }
    .spotlight-initials {
      position: absolute; left: 50%; top: 100%; transform: translate(-50%, 5px);
      font-family: var(--display); font-weight: 800; font-size: .66rem;
      color: var(--gold); background: rgba(6,14,9,.85); padding: 1px 5px;
      border-radius: 4px; white-space: nowrap; pointer-events: none;
    }
    @keyframes spotlight-pulse {
      0%, 100% { opacity: .5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    }

    /* "Focus" selector: highlight whichever overlay is genuinely about the
       chosen player (compares the real base.focus_player, not variant text). */
    .overlay.focused {
      border-left-color: var(--gold); box-shadow: 0 0 0 2px rgba(251,191,36,.5), 0 8px 24px rgba(0,0,0,.4);
    }
    .overlay.focused .tag::after { content: '· ★ following'; margin-left: 4px; color: var(--gold); }

    /* ---- overlay card: shared base, then per-template overrides -------- */
    .overlay {
      position: absolute; background: var(--panel); border-radius: 6px;
      padding: 12px 16px; transition: opacity .4s ease, transform .4s cubic-bezier(.2,.8,.2,1);
      opacity: 0; pointer-events: none; transform: translateY(10px);
      left: 4%; bottom: 7%; max-width: 58%; z-index: 2;
      border-left: 4px solid var(--control);
      backdrop-filter: blur(2px);
    }
    .overlay.visible { opacity: 1; transform: translateY(0); }
    .overlay .tag {
      font-size: .66rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--ink-dim); margin-bottom: 2px; display: flex; gap: 6px; align-items: center;
    }
    .overlay h2 {
      margin: 0 0 3px; font-size: 1.3rem; line-height: 1.15; text-wrap: balance;
      font-family: var(--display); font-weight: 700; letter-spacing: .005em;
    }
    .overlay p.sub { margin: 0; color: var(--ink-dim); font-size: .85rem; }
    .stats { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .stat-chip {
      font-variant-numeric: tabular-nums; font-size: .76rem;
      background: rgba(255,255,255,.06); border-radius: 5px; padding: 3px 7px;
    }
    .stat-chip b { color: var(--ink); }
    .stat-arrow { font-weight: 700; }
    .stat-arrow.up { color: var(--control); }
    .stat-arrow.down { color: var(--chaos); }

    /* player_tag: compact name badge, top-right, no subline emphasis */
    .overlay[data-template="player_tag"] {
      left: auto; right: 4%; bottom: auto; top: 6%; max-width: 46%;
      border-left: none; border-right: 4px solid var(--ink);
      text-align: right;
    }
    .overlay[data-template="player_tag"] .stats { justify-content: flex-end; }

    /* stat_compare: comparison bars instead of plain chips */
    .overlay[data-template="stat_compare"] { border-left-color: var(--info); max-width: 64%; }
    .overlay[data-template="stat_compare"] .stats { flex-direction: column; gap: 6px; width: 100%; }
    .compare-bar { display: flex; align-items: center; gap: 8px; font-size: .8rem; }
    .compare-bar .label { width: 120px; color: var(--ink-dim); flex-shrink: 0; }
    .compare-track { flex: 1; height: 7px; background: rgba(255,255,255,.08); border-radius: 999px; overflow: hidden; }
    .compare-fill { height: 100%; background: var(--info); border-radius: 999px; }

    /* momentum_chart: compact, centered, arrow-forward */
    .overlay[data-template="momentum_chart"] {
      left: 50%; bottom: 7%; max-width: 44%; text-align: center;
      border-left: none; border-top: 3px solid var(--control);
      transform: translateX(-50%) translateY(10px);
    }
    .overlay[data-template="momentum_chart"].visible { transform: translateX(-50%) translateY(0); }
    .overlay[data-template="momentum_chart"] .stats { justify-content: center; }

    /* big_chance: bigger, bolder, gold -- priority-1 moments earn the weight */
    .overlay[data-template="big_chance"] {
      border-left-color: var(--gold); max-width: 66%; padding: 16px 20px;
      box-shadow: 0 0 0 1px rgba(251,191,36,.25), 0 8px 24px rgba(0,0,0,.4);
    }
    .overlay[data-template="big_chance"] h2 { font-size: 1.4rem; }
    .overlay[data-template="big_chance"] .stat-chip { background: rgba(251,191,36,.12); }

    /* stats_only_fallback: muted, honestly labelled -- recovery, not hidden */
    .overlay[data-template="stats_only_fallback"] {
      border-left-color: var(--muted); opacity: .92;
    }
    .overlay[data-template="stats_only_fallback"].visible { opacity: .92; }
    .overlay[data-template="stats_only_fallback"] .tag { color: var(--muted); }

    @media (max-width: 640px) {
      .overlay { max-width: 90% !important; left: 3% !important; right: auto !important; }
      .health-row .name { width: 110px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="matchbar">
      <div class="teams">
        <span id="teamA">—</span><span class="score" id="score">–</span><span id="teamB">—</span>
        <span class="clock" id="clock">00:00</span>
      </div>
      <div class="controls">
        <label>Mode <select id="mode"><option>casual</option><option>analyst</option><option>fan</option></select></label>
        <label>Language <select id="lang"><option>en</option><option>es</option></select></label>
        <label>Focus <select id="focus"><option value="">Any player</option></select></label>
      </div>
    </div>

    <div class="health stale" id="health">
      <div class="health-title">Match health · control</div>
      <div class="health-row">
        <span class="name" id="healthNameA">—</span>
        <div class="health-bar"><div class="health-fill" id="healthFillA"></div></div>
        <span class="health-num" id="healthNumA">—</span>
      </div>
      <div class="health-row away">
        <span class="name" id="healthNameB">—</span>
        <div class="health-bar"><div class="health-fill" id="healthFillB"></div></div>
        <span class="health-num" id="healthNumB">—</span>
      </div>
    </div>

    <div class="main-grid">
    <div class="stage">
      <svg class="pitch-lines" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
        <rect x="40" y="40" width="1520" height="820"></rect>
        <line x1="800" y1="40" x2="800" y2="860"></line>
        <circle cx="800" cy="450" r="130"></circle>
        <circle cx="800" cy="450" r="4" fill="rgba(255,255,255,.28)"></circle>
        <!-- left penalty area + goal -->
        <rect x="40" y="260" width="230" height="380"></rect>
        <rect x="40" y="370" width="80" height="160"></rect>
        <rect class="goal" x="18" y="402" width="22" height="96"></rect>
        <path d="M 270 350 A 130 130 0 0 1 270 550"></path>
        <circle cx="210" cy="450" r="4" fill="rgba(255,255,255,.28)"></circle>
        <!-- right penalty area + goal -->
        <rect x="1330" y="260" width="230" height="380"></rect>
        <rect x="1480" y="370" width="80" height="160"></rect>
        <rect class="goal" x="1560" y="402" width="22" height="96"></rect>
        <path d="M 1330 350 A 130 130 0 0 0 1330 550"></path>
        <circle cx="1390" cy="450" r="4" fill="rgba(255,255,255,.28)"></circle>
        <!-- corner arcs -->
        <path d="M 40 70 A 30 30 0 0 0 70 40"></path>
        <path d="M 1530 40 A 30 30 0 0 0 1560 70"></path>
        <path d="M 1560 830 A 30 30 0 0 0 1530 860"></path>
        <path d="M 70 860 A 30 30 0 0 0 40 830"></path>
      </svg>
      <div class="watermark">Match Health</div>
      <div id="overlay" class="overlay">
        <div class="tag" id="tag"></div>
        <h2 id="headline"></h2>
        <p class="sub" id="subline"></p>
        <div id="stats" class="stats"></div>
      </div>
    </div>

    <div class="activity-panel">
      <div class="activity-title">Agent activity <span id="activityCount">0 decisions</span></div>
      <div id="activityList"></div>
    </div>
    </div>
  </div>

  <script>
    // Two message shapes arrive on the same socket:
    //  - {"base": Overlay, "variants": [...]} -- a moment to show, see schemas/overlay.schema.json
    //  - {"show_at": "MM:SS", "teams": {name: HealthSnapshot}} -- a live health tick
    const TAG_LABEL = {
      lower_third_stat: 'Insight', player_tag: 'Player', stat_compare: 'Compare',
      momentum_chart: 'Momentum', big_chance: 'Big chance', stats_only_fallback: 'Auto-recovery · stats only',
    };

    const pick = (msg) => {
      const mode = document.getElementById('mode').value;
      const lang = document.getElementById('lang').value;
      return msg.variants.find(v => v.mode === mode && v.language === lang) || msg.base;
    };

    function shortLabel(label) {
      // Long agent-generated labels ("Opponent pass completion pct") don't
      // leave room for chips to sit side by side in the card -- trim rather
      // than let them each claim a full row.
      return label.length > 20 ? label.slice(0, 19) + '…' : label;
    }
    function statChip(s) {
      const label = shortLabel(s.label);
      if (s.from != null && s.to != null) {
        const up = s.to >= s.from;
        return `<span class="stat-chip">${label} <span class="stat-arrow ${up ? 'up' : 'down'}">${up ? '▲' : '▼'}</span> <b>${s.from} → ${s.to}</b></span>`;
      }
      return `<span class="stat-chip">${label}: <b>${s.value ?? '—'}</b></span>`;
    }

    function compareBar(s, maxAbs) {
      const val = s.value ?? s.to ?? 0;
      const pct = maxAbs ? Math.min(100, Math.abs(val) / maxAbs * 100) : 0;
      return `<div class="compare-bar"><span class="label">${s.label}</span>
        <div class="compare-track"><div class="compare-fill" style="width:${pct}%"></div></div>
        <b>${val}</b></div>`;
    }

    // Ambient player dots -- atmosphere only, see the .player-dot CSS comment
    // for why this isn't driven by real per-player tracking data. Each dot
    // wanders locally around its own anchor on its own independent clock --
    // moving all dots to a brand-new pitch-wide point in lockstep looked
    // robotic, so this staggers timing/distance/speed per dot instead.
    const PITCH_BOUNDS = { xMin: 7, xMax: 93, yMin: 10, yMax: 90 }; // % of .stage
    function randIn(min, max) { return min + Math.random() * (max - min); }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function wanderLoop(el, { radius, minDelay, maxDelay, minDur, maxDur, startAnchor }) {
      const anchor = startAnchor || {
        x: randIn(PITCH_BOUNDS.xMin, PITCH_BOUNDS.xMax),
        y: randIn(PITCH_BOUNDS.yMin, PITCH_BOUNDS.yMax),
      };
      el.style.left = `${anchor.x}%`;
      el.style.top = `${anchor.y}%`;
      function step() {
        // occasionally drift the anchor itself so dots don't orbit forever
        // in one tiny patch of pitch
        if (Math.random() < 0.15) {
          anchor.x = clamp(anchor.x + randIn(-15, 15), PITCH_BOUNDS.xMin, PITCH_BOUNDS.xMax);
          anchor.y = clamp(anchor.y + randIn(-15, 15), PITCH_BOUNDS.yMin, PITCH_BOUNDS.yMax);
        }
        const x = clamp(anchor.x + randIn(-radius, radius), PITCH_BOUNDS.xMin, PITCH_BOUNDS.xMax);
        const y = clamp(anchor.y + randIn(-radius, radius), PITCH_BOUNDS.yMin, PITCH_BOUNDS.yMax);
        const duration = randIn(minDur, maxDur);
        el.style.transitionDuration = `${duration}s`;
        el.style.left = `${x}%`;
        el.style.top = `${y}%`;
        setTimeout(step, randIn(minDelay, maxDelay) * 1000);
      }
      setTimeout(step, randIn(0, maxDelay) * 1000); // stagger the first move per dot
    }

    // Rough kickoff shape (not a real formation feed -- just a sane starting
    // spread) so dots don't appear scattered randomly across the pitch
    // before their first wander move.
    const HOME_FORMATION = [
      { x: 12, y: 50 }, { x: 25, y: 22 }, { x: 25, y: 50 }, { x: 25, y: 78 },
      { x: 38, y: 35 }, { x: 38, y: 65 }, { x: 46, y: 50 },
    ];
    const AWAY_FORMATION = [
      { x: 88, y: 50 }, { x: 75, y: 22 }, { x: 75, y: 50 }, { x: 75, y: 78 },
      { x: 62, y: 35 }, { x: 62, y: 65 }, { x: 54, y: 50 },
    ];

    function spawnAmbientPitch() {
      const stage = document.querySelector('.stage');
      HOME_FORMATION.forEach((pos) => {
        const d = document.createElement('div');
        d.className = 'player-dot home';
        stage.appendChild(d);
        wanderLoop(d, { radius: 16, minDelay: 1.5, maxDelay: 4, minDur: 1.8, maxDur: 3.5,
                         startAnchor: pos });
      });
      AWAY_FORMATION.forEach((pos) => {
        const d = document.createElement('div');
        d.className = 'player-dot away';
        stage.appendChild(d);
        wanderLoop(d, { radius: 16, minDelay: 1.5, maxDelay: 4, minDur: 1.8, maxDur: 3.5,
                         startAnchor: pos });
      });
      const ballWrap = document.createElement('div');
      ballWrap.className = 'ball-wrap';
      ballWrap.innerHTML = `
        <div class="ball-dot"></div>
        <div class="spotlight-ring" id="spotlightRing" hidden></div>
        <div class="spotlight-initials" id="spotlightInitials" hidden></div>
      `;
      stage.appendChild(ballWrap);
      wanderLoop(ballWrap, { radius: 22, minDelay: 0.8, maxDelay: 2, minDur: 0.6, maxDur: 1.3 });
      return ballWrap;
    }
    spawnAmbientPitch();

    // Player focus: client-side only. Any player name seen in base.focus_player
    // becomes selectable; comparisons always use the real base value, never a
    // persona-relabelled variant, so "focused" is always honest.
    const seenPlayers = new Set();
    function registerPlayer(name) {
      if (!name || seenPlayers.has(name)) return;
      seenPlayers.add(name);
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      document.getElementById('focus').appendChild(opt);
    }

    function initials(name) {
      return name.split(/\s+/).map(p => p.replace(/\W/g, '')[0] || '').join('').toUpperCase().slice(0, 2);
    }

    let spotlightTimer = null;
    function showSpotlight(player, durationS) {
      const ring = document.getElementById('spotlightRing');
      const label = document.getElementById('spotlightInitials');
      label.textContent = initials(player);
      ring.hidden = false;
      label.hidden = false;
      clearTimeout(spotlightTimer);
      spotlightTimer = setTimeout(() => { ring.hidden = true; label.hidden = true; }, durationS * 1000);
    }

    let hideTimer = null;
    function show(msg) {
      const o = pick(msg);
      const el = document.getElementById('overlay');
      el.dataset.template = o.template;

      // The real player this moment is about (always msg.base, never a
      // persona-relabelled variant -- see the "fan"/focus logic below).
      // Shown right in the tag line so it's unambiguous which player the
      // floating possession ring (on the ambient ball marker, elsewhere on
      // the pitch) corresponds to, rather than relying on spatial proximity.
      const truePlayer = msg.base.focus_player;
      const tagBase = TAG_LABEL[o.template] || o.template;
      document.getElementById('tag').textContent = truePlayer ? `${tagBase} · ${truePlayer}` : tagBase;
      document.getElementById('headline').textContent = o.headline;
      document.getElementById('subline').textContent = o.subline || '';

      // Sync the header clock to this moment's own timestamp. The clock is
      // otherwise only advanced by periodic health ticks (every 10 events),
      // which can race ahead of an overlay that took a little longer to
      // process (e.g. Cosmos write latency) -- without this, the displayed
      // time could be later than the moment actually being narrated.
      document.getElementById('clock').textContent = msg.base.show_at;

      if (o.template === 'stat_compare') {
        const maxAbs = Math.max(1, ...o.stats.map(s => Math.abs(s.value ?? s.to ?? 0)));
        document.getElementById('stats').innerHTML = o.stats.map(s => compareBar(s, maxAbs)).join('');
      } else {
        document.getElementById('stats').innerHTML = o.stats.map(statChip).join('');
      }

      if (truePlayer) registerPlayer(truePlayer);
      const focusChoice = document.getElementById('focus').value;
      el.classList.toggle('focused', !!focusChoice && truePlayer === focusChoice);
      if (truePlayer) showSpotlight(truePlayer, o.duration_s);

      el.classList.add('visible');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => el.classList.remove('visible'), o.duration_s * 1000);
    }

    let teamNames = null;
    function updateHealth(msg) {
      const names = Object.keys(msg.teams);
      if (!teamNames) {
        teamNames = names;
        document.getElementById('teamA').textContent = names[0];
        document.getElementById('teamB').textContent = names[1];
        document.getElementById('healthNameA').textContent = names[0];
        document.getElementById('healthNameB').textContent = names[1];
      }
      document.getElementById('clock').textContent = msg.show_at;
      document.getElementById('health').classList.remove('stale');
      const [a, b] = teamNames.map(n => msg.teams[n]);
      document.getElementById('healthFillA').style.width = `${a.control}%`;
      document.getElementById('healthNumA').textContent = a.control.toFixed(0);
      document.getElementById('healthFillB').style.width = `${b.control}%`;
      document.getElementById('healthNumB').textContent = b.control.toFixed(0);
      if (msg.score) {
        document.getElementById('score').textContent =
          `${msg.score[teamNames[0]]} – ${msg.score[teamNames[1]]}`;
      }
    }

    // Agent Activity: every real Spotter decision (confirmed or rejected),
    // see orchestrator.py's activity_send. Newest first, capped list.
    let activityCount = 0;
    function addActivity(a) {
      activityCount++;
      document.getElementById('activityCount').textContent =
        `${activityCount} decision${activityCount === 1 ? '' : 's'}`;
      const list = document.getElementById('activityList');
      const item = document.createElement('div');
      item.className = `activity-item ${a.confirmed ? 'confirmed' : 'rejected'}`;
      const who = a.player ? `${a.player} · ${a.team}` : a.team;
      item.innerHTML = `
        <div class="activity-badge">${a.confirmed ? '✓' : '✕'}</div>
        <div class="activity-body">
          <div class="headline">${a.kind.replace(/_/g, ' ')}
            <span class="meta">P${a.priority ?? '?'} · ${a.show_at}</span></div>
          <div class="meta">${who}</div>
          ${a.reason ? `<div class="reason">${a.reason}</div>` : ''}
        </div>`;
      list.insertBefore(item, list.firstChild);
      while (list.children.length > 8) list.removeChild(list.lastChild);
    }

    // Local dev path (file://): the local preview server from
    // `python -m matchhealth.run --preview`, no Azure needed.
    // Deployed path (http/https): negotiate a short-lived Web PubSub client
    // token from the deployed negotiate service, then connect directly.
    const LOCAL_PREVIEW_WS = "ws://localhost:8765";
    const NEGOTIATE_URL =
      "https://matchhealth-negotiate.redmushroom-42fc2d2c.eastus2.azurecontainerapps.io/negotiate";
    let lastMsg = null;

    function onMessage(raw) {
      const msg = JSON.parse(raw);
      if (msg.teams) { updateHealth(msg); return; }
      if (msg.kind) { addActivity(msg); return; }
      if (msg.base) { lastMsg = msg; show(msg); }
    }

    function openSocket(url) {
      const ws = new WebSocket(url);
      ws.onopen = () => console.log("connected:", url);
      ws.onmessage = (ev) => onMessage(ev.data);
      ws.onerror = () => console.warn("socket error, will retry:", url);
      ws.onclose = () => setTimeout(connect, 1500);
    }

    async function connect() {
      if (location.protocol !== "file:") {
        try {
          const res = await fetch(NEGOTIATE_URL);
          const { url } = await res.json();
          openSocket(url);
          return;
        } catch (e) {
          console.warn("negotiate failed, retrying in 1.5s:", e);
          setTimeout(connect, 1500);
          return;
        }
      }
      openSocket(LOCAL_PREVIEW_WS);
    }
    connect();

    for (const id of ['mode', 'lang', 'focus']) {
      document.getElementById(id).addEventListener('change', () => lastMsg && show(lastMsg));
    }
  </script>
</body>
</html>
